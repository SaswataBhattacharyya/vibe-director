<!doctype html><html><head><meta charset="utf-8"><title>Vibe · Backlot editing extension</title><style>
:root{color-scheme:dark;font:15px system-ui}body{margin:0;background:#14111b;color:#eee}header{padding:16px 24px;border-bottom:1px solid #484050;display:flex;gap:24px;align-items:center}a{color:#f5d07a}main{display:grid;grid-template-columns:minmax(280px,380px) 1fr;height:calc(100vh - 65px)}section{padding:24px;overflow:auto}iframe{width:100%;height:100%;border:0}label{display:grid;gap:8px;margin-bottom:18px}input,textarea,select,button{font:inherit;color:inherit;background:#211b2b;border:1px solid #64566f;border-radius:8px;padding:10px}textarea{resize:vertical}button{cursor:pointer}p{line-height:1.6}.status{color:#f5d07a}@media(max-width:800px){main{display:block;height:auto}iframe{height:60vh}}
</style></head><body><header><strong>Vibe editing extension</strong><a href="/p/production" target="_blank" rel="noopener">Native Backlot</a></header><main><section><p>Edit saved shot preparation here. Send a proposal, then review it in Vibe and save the storyboard. This does not run generation.</p><label>Shot<select id="shot"></select></label><label>Prompt<textarea id="prompt" rows="5" maxlength="6999"></textarea></label><label>Video prompt<textarea id="video_prompt" rows="4" maxlength="6999"></textarea></label><label>Duration (seconds)<input id="duration" type="number" min="0.1" max="3600" step="0.1"></label><label>Notes<textarea id="notes" rows="3" maxlength="4000"></textarea></label><button id="send">Send edits for review in Vibe</button><p id="status" class="status" role="status"></p></section><iframe title="Native OpenMontage Backlot" src="/p/production"></iframe></main><script>
const fields=['prompt','video_prompt','duration','notes'];let state,active,draft={};const node=id=>document.getElementById(id),status=text=>node('status').textContent=text;
function stash(){if(!active)return;draft[active]=Object.fromEntries(fields.map(k=>[k,k==='duration'?Number(node(k).value):node(k).value]));}
function select(){active=node('shot').value;for(const field of fields)node(field).value=(draft[active]||state.body.shots[active])[field];}
node('shot').onchange=()=>{stash();select();};
node('send').onclick=async()=>{stash();node('send').disabled=true;try{const changes=Object.entries(draft).map(([shot_key,values])=>({shot_key,values}));const response=await fetch('/vibe/proposal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_revision:state.revision,changes})});if(!response.ok)throw Error('Could not stage this proposal. Reopen the workspace if it expired.');status('Proposal ready. In Vibe choose “Review Backlot edits”, inspect the changes, then save.');}catch(error){status(error.message);}finally{node('send').disabled=false;}};
fetch('/vibe/state').then(r=>{if(!r.ok)throw Error('Saved storyboard unavailable');return r.json();}).then(value=>{state=value;for(const key of Object.keys(state.body.shots)){const option=document.createElement('option');option.value=key;option.textContent='Shot '+key;node('shot').append(option);}select();status('Editing saved board revision '+state.revision);}).catch(error=>status(error.message));
</script></body></html>
